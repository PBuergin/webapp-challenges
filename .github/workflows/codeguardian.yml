name: CodeGuardian Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Base repo only. Never check out fork code in a pull_request_target job:
      # it runs with our token and secrets ("pwn request").
      - uses: actions/checkout@v5

      - name: Get PR diff
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --slurp \
            > /tmp/pr-files.json
          jq -r '.[][] | select(.filename | startswith("challenges/")) | .filename + "\n" + (.patch // "")' \
            /tmp/pr-files.json > /tmp/pr-diff.txt
          jq -r '.[][] | select(.filename | startswith("challenges/")) | .filename' \
            /tmp/pr-files.json > /tmp/pr-names.txt

      - name: Find challenge and codeguardian config
        id: config
        run: |
          CHALLENGE_DIR=$(head -1 /tmp/pr-names.txt | cut -d'/' -f1-2)
          echo "challenge_dir=$CHALLENGE_DIR" >> "$GITHUB_OUTPUT"

          if [ -n "$CHALLENGE_DIR" ] && [ -f "$CHALLENGE_DIR/.codeguardian.json" ]; then
            echo "has_config=true" >> "$GITHUB_OUTPUT"
            cat "$CHALLENGE_DIR/.codeguardian.json" > /tmp/codeguardian.json
          else
            echo "has_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CodeGuardian Review
        if: steps.config.outputs.has_config == 'true'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "Error: MINIMAX_API_KEY secret is not set in this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          DIFF=$(cat /tmp/pr-diff.txt)
          CONFIG=$(cat /tmp/codeguardian.json)
          INSTRUCTIONS=$(cat .github/copilot-instructions.md)

          PAYLOAD=$(jq -n \
            --arg model "MiniMax-M3" \
            --arg system "$INSTRUCTIONS" \
            --arg diff "$DIFF" \
            --arg config "$CONFIG" \
            '{
              model: $model,
              max_tokens: 4096,
              system: $system,
              messages: [
                {
                  role: "user",
                  content: ("Hier ist der PR-Diff:\n\n```diff\n" + $diff + "\n```\n\nHier ist die .codeguardian.json:\n\n```json\n" + $config + "\n```\n\nErstelle jetzt das CodeGuardian Review im exakten Format aus deinen Instruktionen. KEIN Loesungscode, KEINE Inline-Kommentare, NUR die Bug-Tracker-Tabelle.")
                }
              ]
            }')

          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://api.minimax.io/anthropic/v1/messages" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MINIMAX_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -d "$PAYLOAD")

          HTTP_CODE=$(printf '%s' "$HTTP_RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API error (HTTP $HTTP_CODE):"
            echo "$BODY"
            exit 1
          fi

          REVIEW=$(printf '%s' "$BODY" | jq -r '[.content[]? | select(.type=="text") | .text] | first // empty')
          REVIEW=$(printf '%s' "$REVIEW" | sed '/^```markdown$/d; /^```$/d')

          if [ -z "$REVIEW" ]; then
            echo "Error: No review text in API response"
            echo "$BODY"
            exit 1
          fi

          gh pr comment "$PR" --repo "${{ github.repository }}" --body "$REVIEW"

      - name: Post no-config notice
        if: steps.config.outputs.has_config == 'false'
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body \
            "Diese Challenge hat kein automatisches CodeGuardian-Review. Bitte wende dich an den Dozenten für Feedback."
